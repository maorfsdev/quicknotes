version: '3.8'

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: quicknotes-postgres
    environment:
      POSTGRES_DB: quicknotes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quicknotes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quicknotes-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: quicknotes-redis
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quicknotes-network

  # API Instance 1
  api1:
    build: ./backend
    container_name: quicknotes-api1
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: quicknotes
      JWT_SECRET: change-me-in-production-use-strong-secret-key-32-chars-minimum
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quicknotes-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # API Instance 2
  api2:
    build: ./backend
    container_name: quicknotes-api2
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: quicknotes
      JWT_SECRET: change-me-in-production-use-strong-secret-key-32-chars-minimum
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quicknotes-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Load Balancer
  lb:
    image: nginx:alpine
    container_name: quicknotes-lb
    depends_on:
      - api1
      - api2
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quicknotes-network

  # Frontend
  frontend:
    build: ./frontend
    container_name: quicknotes-frontend
    environment:
      - VITE_API_URL=http://lb
    depends_on:
      - lb
    ports:
      - "5174:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quicknotes-network

networks:
  quicknotes-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local